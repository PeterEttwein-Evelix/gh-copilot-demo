name: CI – Album Viewer

on:
  push:
    branches: ["**"]
    paths:
      - "album-viewer/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "album-viewer/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  build-and-test:
    name: Build & Test (Vue.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: album-viewer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: album-viewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run
